# The shot cards' fixed part: what each frame is for, what it must show, and what the critic may not change.
# critic/card.py joins this with the shot's current settings (the engine's shot file) into one card per round.

product: >
  earmilk, a floorstanding three-way active loudspeaker built as a half-gallon gable-top milk carton: 390 x 390 mm
  plan, 1055 mm tall, Baltic birch under a lacquer finish in the flavour's colours (a colour coat under a clear), a
  plinth band in the accent colour, cast metal letters "earmilk" on the plinth, a 12 in woofer (Dayton RSS315HF-4,
  black anodised aluminium cone) and a 6.5 in mid (SB Acoustics Satori MR16P-8, papyrus cone) flush on the front under
  trim rings, a 1 in dome tweeter (SB Satori TW29DN-B) rear-mounted at the throat of a waveguide insert in the roof's
  front slope, and on the back a printed Nutrition Facts panel, a port and a Hypex FusionAmp plate amplifier.

products:
  studio/products/earmilk-bookshelf.json: >
    earmilk bookshelf, the floorstander's two-way active little sibling, the same gable-top carton at 220 x 220 mm
    plan and 594 mm tall: Baltic birch under a lacquer finish in the flavour's colours, a plinth band in the accent
    colour, cast metal letters "earmilk" on the plinth, a 6.5 in woofer (SB Acoustics SB17NRX2C35-8, black paper
    cone) flush on the front under a trim ring, a 1 in dome tweeter (Scan-Speak Illuminator D3004/602200) at the
    throat of a waveguide insert in the roof's front slope, the Nutrition Facts printed on its right side as on a
    real carton, and on the back a Hypex FusionAmp FA122 plate amplifier standing upright.

fixed:
  - >-
    The product's geometry and proportions (plan, heights, the 37.6 degree roof, the fin, the 6 mm rounds on the
    corners and hips, the 3 mm shadow lines under the gable and over the plinth). They are the spec.
  - >-
    The tweeter's waveguide. Its depth, profile, mouth and the tweeter's place in it are set by acoustic simulation
    (coverage, smooth off-axis response, a match to the midrange where the two cross over), not by looks. Light and
    camera may change how it reads; its shape may not. Do not ask for the tweeter to move, the bowl to be shallower
    or deeper, its rim to change, or a flange or grille to be added.
  - >-
    The drivers are real, named products, mounted flush under trim rings (the owner's decision). Their materials and
    colours are the products' own.
  - >-
    The flavours' colours (sRGB): Whole body #FFFFFF, accent #C62828; 2% #FFFFFF / #1F4FCF; Skim #FFFFFF / #6FA5DC; Matcha #A4C26B / #004225 (a matcha-green body, British racing green on the gable, fin, plinth and the waveguide insert);
    Chocolate #5E3A1F / #F1E3CC; Oat #D9BC92 / #2B2118. You may ask for a colour to be reproduced more accurately
    (exposure, white balance, view transform), never for a different colour.
  - >-
    The marks: the wordmark's typeface, size and tight tracking; the Nutrition Facts panel's layout and copy; OPEN
    OTHER SIDE on the fin's back; SHAKE WELL on the plinth's back; the light plinths' dark bronze letters.
  - >-
    What the shot's purpose below fixes about framing.

shots:
  shot-01:
    title: Hero pair, sunlit living room
    purpose: >
      The deck's opening image and the homepage hero: a stereo pair in a real, lived-in room in low sun, read first as
      a premium hi-fi product and second as a milk carton. Landscape, copy space on one side.
    must_show: [both speakers whole, their fronts and drivers, the sun's light on the room and the cabinets, a floor and wall that read as real materials]
  shot-02a:
    title: One speaker, bright room
    purpose: >-
      Lifestyle page: one speaker in a bright, airy room in morning light; calm, clean, believable.
    must_show: [the speaker whole, front and one side, the room's light, the floor contact]
  shot-02b:
    title: One speaker, older room at golden hour
    purpose: >-
      Mood page: low warm sun through a window, the carton's silhouette thrown on the wall beside it.
    must_show: [the speaker whole, its silhouette on the wall reading as the carton, the warm light]
  shot-03:
    title: The waveguide, close
    purpose: >
      The engineering detail page: the roof's waveguide and the tweeter at its throat, close and sharp, as a designed,
      machined part. A close-up by brief: the whole carton is not required.
    must_show: [the waveguide's mouth and walls, the tweeter at its throat, the roof's slope and fin for context]
  shot-04a:
    title: The back's label, straight on
    purpose: >-
      The joke's page: the Nutrition Facts panel legible, straight on and level, the gable above it for context.
    must_show: [the Facts panel legible, the back's letters, the fin with OPEN OTHER SIDE]
  shot-04b:
    title: The back, three-quarter
    purpose: >-
      The back as an object on a studio sweep: the label, the port and the amplifier's connections, with copy space.
    must_show: [the back with its label, port and connections, one side, the floor contact]
  shot-05:
    title: Six flavours
    purpose: >-
      The range page: all six colourways in a row, raised three-quarter, as one product line.
    must_show: [all six whole, their colours true, the same finish on each]
  shot-06:
    title: The pint crate
    purpose: >-
      The family page: six desk-size pints in a moulded dairy crate.
    must_show: [the crate whole, the pints' roofs and fronts, the floor contact]
  shot-07:
    title: How it goes together
    purpose: >-
      The build page: the speaker exploded along each part's own fixing axis, as an engineering illustration rendered
      photographically. The waveguide insert drawn forward out of its pocket like a drawer, the tweeter behind it on
      the axis of its screws, the drivers and their trim rings forward out of their rebates; the empty pocket, its
      boss bore and magnets visible. Every part distinct, nothing overlapping, on a clean studio sweep.
    must_show: [the insert clear of the roof with the empty pocket behind it, the tweeter between the insert and the pocket, both drivers and both trim rings separated, the whole cabinet]
    fixed:
      - >-
        Each part is drawn out along its own fixing axis, in assembly order; do not ask for a part to leave its axis
        or its order. How far each is drawn out along it (`product.explode.N.offset_m`) is yours, and camera, light
        and set may change.
  shot-08:
    title: The inside
    purpose: >-
      The inside page: the cabinet cut on its centre plane with the near half removed, showing the woofer chamber,
      the mid's sealed chamber, the brace, the amplifier's sealed box, the waveguide insert in its pocket with the
      tweeter rear-mounted on it, the connector bay behind it and the tweeter's cable down the channel to the
      amplifier. Read as a technical cutaway rendered photographically.
    must_show: [the cut face of every panel, the insert and tweeter in section, the connector and the cable's run to the amplifier box, the drivers in section, the amplifier's box]
    fixed:
      - >-
        The cut's position (the centre plane) and what is cut; do not ask for parts to move or to be cut
        differently. Camera, light, set and the section colour's reproduction may change.
  shot-09:
    title: The bookshelf pair on a sideboard
    purpose: >-
      The bookshelf's hero: a stereo pair of the small size on a sideboard in a bright, lived-in room, read first as
      a premium hi-fi product and second as a pair of quart milk cartons. Landscape.
    must_show: [both speakers whole, their fronts and roofs, the sideboard's top, the room's light]
  shot-10:
    title: The family
    purpose: >-
      The range page: the floorstander on the floor beside a bookshelf on a sideboard, one family in two sizes and two
      flavours, in the same room and light.
    must_show: [both whole, the size relation readable, their fronts and roofs]
  shot-08b:
    title: The tweeter, how it fits and how it is wired
    purpose: >-
      The detail the builder asked for: the roof cut on its centre plane, close, so the waveguide insert, the tweeter
      rear-mounted in its counterbore and held there by the printed retaining sleeve over its motor (the sleeve's
      flange screwed to the boss's back face), the magnets that hold the insert, the connector bay behind it with the
      plugged connector, the cable channel, the silicone seal where the cable passes the top panel and the cable's run
      into the box all read at a glance. A technical cutaway rendered photographically; a close-up by brief, the whole
      speaker not required.
    must_show: [the insert and its waveguide in section, the tweeter in its counterbore, the retaining sleeve and its flange, the magnets, the connector in its bay, the cable down the channel and the seal under the top panel]
    fixed:
      - >-
        The cut's position (the centre plane) and what is cut; do not ask for parts to move or to be cut
        differently. Camera, light, set and the section colours' reproduction may change.
